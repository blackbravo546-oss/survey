<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's Always Yes</title>
<style>
  :root {
    --bg1: #1e1b4b;
    --bg2: #4c1d95;
    --card: #ffffff;
    --accent: #22c55e;
    --text: #1f2937;
    --muted: #6b7280;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    padding: 20px;
    overflow-x: hidden;
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
    position: relative;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 1.4rem;
    color: var(--text);
  }

  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.95rem;
  }


  #question {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.05rem;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  #question:focus {
    border-color: var(--bg2);
  }
 

  .answer-zone {
    position: relative;
    height: 220px;
    margin-top: 28px;
    border-radius: 14px;
    background: #f9fafb;
    border: 1px dashed #d1d5db;
    overflow: hidden;
  }

  .answer-label {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  #yesBtn {
    position: absolute;
    top: 50%;
    left: 65%;
    transform: translate(-50%, -50%);
    padding: 16px 40px;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(34,197,94,0.4);
  transition: top 0.05s ease-out, left 0.05s ease-out;
    white-space: nowrap;
    z-index: 2;
  }

  #noBtn {
    position: absolute;
    top: 50%;
    left: 25%;
    transform: translate(-50%, -50%);
    padding: 16px 40px;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    background: #ef4444;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(239,68,68,0.4);
    white-space: nowrap;
    z-index: 1;
  }
  #noBtn:hover {
    background: #dc2626;
  }

  #caughtMsg, #noMsg {
    display: none;
    margin-top: 16px;
    font-weight: 600;
    font-size: 1.05rem;
  }
  #caughtMsg { color: var(--accent); }
  #noMsg { color: #ef4444; }

  footer {
    margin-top: 20px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  #shareBtn {
    margin-top: 18px;
    padding: 10px 20px;
    font-size: 0.9rem;
    border-radius: 10px;
    border: 2px solid var(--bg2);
    background: white;
    color: var(--bg2);
    cursor: pointer;
    font-weight: 600;
  }
  #shareBtn:hover { background: #f3f4f6; }
</style>
</head>
<body>

<div class="card">
  <h1>Ask anything. The answer is always Yes.</h1>


 
  <div id="question">papasok bukas??</div>

  <div class="answer-zone" id="zone">
    <div class="answer-label">Answer</div>
    <button id="noBtn">YES</button>
    <button id="yesBtn">NO</button>
  </div>

  <div id="caughtMsg">mali ka ng sagot d po bagay.</div>
  <div id="noMsg">naging tama ka din.</div>

  <button id="shareBtn" onclick="shareSite()">🔗 Copy link to share</button>

</div>

<script>
  const btn = document.getElementById('yesBtn');
  const zone = document.getElementById('zone');
  const caughtMsg = document.getElementById('caughtMsg');
  let caught = false;

  function dodge(clientX, clientY) {
    if (caught) return;
    const zoneRect = zone.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();

    const btnCenterX = btnRect.left + btnRect.width / 2;
    const btnCenterY = btnRect.top + btnRect.height / 2;

    const dist = Math.hypot(clientX - btnCenterX, clientY - btnCenterY);
    const triggerDistance = 200;

    if (dist < triggerDistance) {
      const padding = 10;
      const maxX = zoneRect.width - btnRect.width - padding;
      const maxY = zoneRect.height - btnRect.height - padding;

      const newX = Math.max(padding, Math.random() * maxX);
      const newY = Math.max(padding, Math.random() * maxY);

      btn.style.left = newX + btnRect.width / 2 + 'px';
      btn.style.top = newY + btnRect.height / 2 + 'px';
    }
  }

  zone.addEventListener('mousemove', (e) => {
    dodge(e.clientX, e.clientY);
  });

  // touch support: dodge as soon as a touch lands near it
zone.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  dodge(t.clientX, t.clientY);
});

zone.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  dodge(t.clientX, t.clientY);
});
  btn.addEventListener('click', () => {
    caught = true;
    caughtMsg.style.display = 'block';
    btn.style.background = '#16a34a';
    btn.textContent = 'YES!! ';
  });

  const noBtn = document.getElementById('noBtn');
  const noMsg = document.getElementById('noMsg');
  noBtn.addEventListener('click', () => {
    noMsg.style.display = 'block';
  });

  function shareSite() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const b = document.getElementById('shareBtn');
      const original = b.textContent;
      b.textContent = '✅ Link copied!';
      setTimeout(() => b.textContent = original, 1800);
    }).catch(() => {
      alert('Copy this page\'s URL to share it with friends!');
    });
  }
</script>

</body>
</html>
